<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Craig's Claude Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0e1014; --panel: #14171d; --panel-2: #171b22; --row-hover: #181c24;
    --hair: #232830; --hair-soft: #1d2128;
    --ink: #e7eaef; --ink-2: #aab3c0; --ink-3: #6f7886; --ink-4: #4a525e;
    --calm: #3a4250; --warn: #d9a23a; --warn-bg: rgba(217,162,58,0.10);
    --alarm: #e5484d; --alarm-bg: rgba(229,72,77,0.12); --alarm-edge: rgba(229,72,77,0.55);
    --ok: #4e8a64;
    --accent: #7c93b3;
    --radius: 10px;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --ui: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  body { min-height: 100vh; display: flex; justify-content: center; padding: 38px 30px 52px; }
  .app { width: 100%; max-width: 1320px; }

  /* Header */
  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
  .brand { display: flex; align-items: baseline; gap: 13px; min-width: 0; }
  .brand h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0; white-space: nowrap; }
  .brand .mark { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); transform: translateY(-2px); box-shadow: 0 0 0 3px rgba(124,147,179,0.12); flex: none; }
  .acct-count { font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.02em; white-space: nowrap; }
  .controls { display: flex; align-items: center; gap: 8px; flex: none; }
  .freshness { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.01em; display: inline-flex; align-items: center; gap: 7px; margin-right: 6px; white-space: nowrap; }
  .freshness .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(78,138,100,0.14); flex: none; }
  .freshness.behind { color: var(--warn); } .freshness.behind .dot { background: var(--warn); box-shadow: 0 0 0 3px rgba(217,162,58,0.14); }
  .freshness.off { color: var(--alarm); } .freshness.off .dot { background: var(--alarm); box-shadow: 0 0 0 3px rgba(229,72,77,0.14); }
  .btn { font-family: var(--ui); font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--hair); border-radius: 8px; padding: 7px 13px; cursor: pointer; letter-spacing: 0.01em; transition: background .12s ease, color .12s ease, border-color .12s ease; white-space: nowrap; }
  .btn:hover { background: var(--row-hover); color: var(--ink); border-color: #2c333d; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn .ic { color: var(--ink-3); margin-right: 5px; }
  .btn.active { color: var(--accent); border-color: rgba(124,147,179,0.55); background: rgba(124,147,179,0.10); }
  .btn.active .ic { color: var(--accent); }

  /* Summary strip */
  .summary { display: flex; align-items: center; gap: 18px; background: var(--panel); border: 1px solid var(--hair); border-left: 3px solid var(--hair); border-radius: var(--radius); padding: 15px 20px; margin-bottom: 22px; }
  .summary.alarm { border-left-color: var(--alarm); }
  .summary.warn { border-left-color: var(--warn); }
  .summary.clear { border-left-color: var(--ok); }
  .summary .sig { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; border-radius: 6px; padding: 5px 9px; white-space: nowrap; }
  .summary.alarm .sig { color: var(--alarm); background: var(--alarm-bg); border: 1px solid var(--alarm-edge); }
  .summary.warn .sig { color: var(--warn); background: var(--warn-bg); border: 1px solid rgba(217,162,58,0.5); }
  .summary.clear .sig { color: var(--ok); background: rgba(78,138,100,0.10); border: 1px solid rgba(78,138,100,0.45); }
  .summary .line { font-size: 14.5px; color: var(--ink-2); line-height: 1.45; min-width: 0; }
  .summary .line b { color: var(--ink); font-weight: 600; }
  .summary .line .mono { font-family: var(--mono); font-weight: 600; }
  .summary.alarm .line .mono { color: var(--alarm); } .summary.warn .line .mono { color: var(--warn); } .summary.clear .line .mono { color: var(--ink); }
  .summary .line .when { font-family: var(--mono); color: var(--ink-2); }
  .summary .spacer { flex: 1; }
  .summary .total { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .summary .total b { color: var(--ink); font-weight: 600; }

  /* Fleet bar: one capacity-weighted picture of every account, and when
     used capacity comes back. Used is split into "locked until a weekly
     reset" (solid) and "back within 5h" (hatched); the rest of the track
     is free now. */
  .fleet { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); padding: 15px 20px 13px; margin-bottom: 14px; }
  .fleet-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  .fleet-title { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .fleet-num { font-family: var(--mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "zero" 1; line-height: 1; color: var(--ink); letter-spacing: -0.01em; white-space: nowrap; }
  .fleet-num .sym { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 1px; }
  .fleet-num .lbl { font-family: var(--ui); font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 6px; letter-spacing: 0; }
  .fleet.warn .fleet-num { color: var(--warn); } .fleet.alarm .fleet-num { color: var(--alarm); }
  .fleet-free { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .fleet-free b { color: var(--ink); font-weight: 600; }
  .fleet-head .spacer { flex: 1; }
  /* Codex: its own panel and bar under the fleet bar (it also counts in the fleet). */
  .codex { cursor: pointer; }
  .codex .cx-who { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .codex .cx-plan { font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--hair); border-radius: 5px; padding: 1px 7px; white-space: nowrap; }
  .codex .cx-credits { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .codex .cx-credits b { color: var(--ink-2); font-weight: 600; }
  .codex .cx-win { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 12px; margin-top: 8px; }
  .codex .cx-win .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .codex .cx-win .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .codex .cx-win .v b { color: var(--ink); font-weight: 600; }
  .codex .cx-bar { height: 10px; background: #20242c; border-radius: 5px; overflow: hidden; }
  .codex .cx-bar > i { display: block; height: 100%; background: var(--calm); border-radius: 5px; transition: width .45s cubic-bezier(.2,.7,.3,1); }
  .codex .cx-bar.warn > i { background: var(--warn); } .codex .cx-bar.alarm > i { background: var(--alarm); }
  .codex .cx-note { font-family: var(--mono); font-size: 11px; color: var(--ink-4); margin-top: 8px; }
  @media (max-width: 760px) { .codex .cx-win { grid-template-columns: 58px 1fr; } .codex .cx-win .v { grid-column: 1 / -1; } }
  .fleet-pace { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .fleet-pace b { color: var(--ink-2); font-weight: 600; }
  .fleet-pace.hot b { color: var(--warn); }
  .fleet-bar { position: relative; height: 12px; width: 100%; background: #20242c; border-radius: 6px; overflow: hidden; display: flex; }
  .fleet-bar > i { display: block; height: 100%; width: 0; transition: width .45s cubic-bezier(.2,.7,.3,1); }
  .fleet-bar > i.locked { background: var(--calm); border-radius: 6px 0 0 6px; }
  .fleet-bar > i.soon { background: repeating-linear-gradient(135deg, var(--calm) 0 3px, transparent 3px 7px); opacity: .85; }
  .fleet.warn .fleet-bar > i.locked { background: var(--warn); }
  .fleet.warn .fleet-bar > i.soon { background: repeating-linear-gradient(135deg, var(--warn) 0 3px, rgba(217,162,58,0.18) 3px 7px); }
  .fleet.alarm .fleet-bar > i.locked { background: var(--alarm); }
  .fleet.alarm .fleet-bar > i.soon { background: repeating-linear-gradient(135deg, var(--alarm) 0 3px, rgba(229,72,77,0.2) 3px 7px); }
  .fleet-bar .pace-mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; transform: translateX(-1px); pointer-events: none; }
  .fleet-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 9px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.01em; }
  .fleet-legend .k { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .fleet-legend .k b { color: var(--ink-2); font-weight: 600; }
  .fleet-legend .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; background: var(--calm); flex: none; }
  .fleet-legend .sw.soon { background: repeating-linear-gradient(135deg, var(--calm) 0 2px, transparent 2px 4px); border: 1px solid var(--calm); }
  .fleet-legend .sw.free { background: #20242c; }
  .fleet-legend .sw.mark { width: 2px; height: 11px; background: var(--ink); opacity: .55; border-radius: 1px; }
  .fleet.warn .fleet-legend .sw:not(.free):not(.mark) { background: var(--warn); } .fleet.warn .fleet-legend .sw.soon { background: repeating-linear-gradient(135deg, var(--warn) 0 2px, transparent 2px 4px); border-color: var(--warn); }
  .fleet.alarm .fleet-legend .sw:not(.free):not(.mark) { background: var(--alarm); } .fleet.alarm .fleet-legend .sw.soon { background: repeating-linear-gradient(135deg, var(--alarm) 0 2px, transparent 2px 4px); border-color: var(--alarm); }
  .fleet-legend .blocked b { color: var(--alarm); }
  .fleet-relief { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hair-soft); font-size: 12.5px; color: var(--ink-3); }
  .fleet-relief .rl { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4); white-space: nowrap; }
  .fleet-relief .ev { white-space: nowrap; }
  .fleet-relief .ev .who { color: var(--ink-2); }
  .fleet-relief .ev .in { font-family: var(--mono); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .fleet-relief .ev .gain { font-family: var(--mono); color: var(--ok); font-weight: 500; }
  .fleet-relief .fresh { white-space: nowrap; margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
  .fleet-relief .fresh b { color: var(--ink-3); font-weight: 500; }
  .fleet { animation: rise .3s cubic-bezier(.2,.7,.3,1) both; }
  @media (prefers-reduced-motion: reduce) { .fleet { animation: none; } .fleet-bar > i { transition: none; } }

  /* Board */
  .board { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--radius); overflow: hidden; }
  .board-scroll { overflow-x: auto; }
  .grid {
    display: grid;
    grid-template-columns: 16px minmax(220px,1.6fr) 104px minmax(148px,1.3fr) minmax(148px,1.3fr) minmax(104px,0.85fr) minmax(150px,1.2fr) 96px;
    align-items: center; min-width: 980px;
  }
  .head { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--hair); }
  .head > div { padding: 13px 16px; }
  .head .sort { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: inherit; white-space: nowrap; border-radius: 4px; transition: color .12s; }
  .head .sort:hover { color: var(--ink-2); }
  .head .sort.on { color: var(--ink); }
  .head .sort .arr { font-size: 9px; width: 8px; opacity: 0; }
  .head .sort:hover .arr { opacity: .5; }
  .head .sort.on .arr { opacity: 1; color: var(--accent); }
  .head .sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .head .head-pair { display: flex; align-items: center; gap: 12px; }
  .foot .sortnote button { all: unset; cursor: pointer; color: var(--ink-3); text-decoration: underline; text-underline-offset: 2px; }
  .foot .sortnote button:hover { color: var(--ink-2); }

  .row { border-bottom: 1px solid var(--hair-soft); transition: background .12s ease; position: relative; }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--row-hover); }
  .row > div { padding: 15px 16px; }
  .tick { padding: 0 !important; }
  .tick > span { display: block; width: 3px; height: 48px; margin: 0 auto; border-radius: 2px; background: transparent; }
  .row.alarm .tick > span, .row.relogin .tick > span { background: var(--alarm); }
  .row.warn .tick > span { background: var(--warn); }
  .row.alarm { background: var(--alarm-bg); }
  .row.alarm:hover { background: rgba(229,72,77,0.16); }
  .row.relogin { background: rgba(229,72,77,0.05); }

  .acct { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .acct .email { font-size: 14px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.idle .acct .email { color: var(--ink-2); }
  .acct .tags { display: flex; gap: 7px; align-items: center; }
  .tag { white-space: nowrap; font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--hair); color: var(--ink-3); }
  .tag.cached { color: var(--warn); border-color: rgba(217,162,58,0.45); }
  .tag.relogin { color: var(--alarm); border-color: var(--alarm-edge); }
  .fleet-legend .banked b { color: var(--ok); }

  .plan .pill { display: inline-block; font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--hair); border-radius: 5px; padding: 3px 8px; color: var(--ink-2); background: var(--panel-2); white-space: nowrap; }

  .metric { display: flex; flex-direction: column; gap: 7px; }
  .row.relogin .metric, .row.errored .metric { opacity: 0.4; }
  .pct { font-family: var(--mono); font-size: 23px; font-weight: 600; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "zero" 1; line-height: 1; color: var(--ink); letter-spacing: -0.01em; }
  .pct .sym { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 1px; }
  .pct.is-warn { color: var(--warn); } .pct.is-alarm { color: var(--alarm); }
  .pct.is-idle { color: var(--ink-4); } .pct.is-idle .sym { color: var(--ink-4); }
  .reset { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.01em; white-space: nowrap; }
  .reset.is-alarm { color: #cf9a9c; } .reset.muted { color: var(--ink-4); }
  .meter { height: 4px; width: 100%; max-width: 150px; background: #20242c; border-radius: 3px; overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 3px; background: var(--calm); width: 0; transition: width .45s cubic-bezier(.2,.7,.3,1); }
  .meter.is-warn > i { background: var(--warn); } .meter.is-alarm > i { background: var(--alarm); } .meter.is-idle > i { background: #262b33; }

  .models { display: flex; flex-direction: column; gap: 5px; }
  .mrow { display: flex; align-items: baseline; justify-content: flex-start; gap: 9px; }
  .mrow .ml { font-family: var(--mono); font-size: 10px; letter-spacing: 0.03em; color: var(--ink-3); text-transform: uppercase; min-width: 46px; }
  .mrow .mv { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 500; }
  .mrow .mv.is-warn { color: var(--warn); } .mrow .mv.is-alarm { color: var(--alarm); }
  .models .none { font-family: var(--mono); font-size: 12px; color: var(--ink-4); }

  .overage { display: flex; flex-direction: column; gap: 7px; }
  .overage .amt { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); letter-spacing: 0.01em; }
  .overage .amt b { color: var(--ink); font-weight: 600; } .overage .amt .of { color: var(--ink-3); }
  .ometer { height: 4px; width: 100%; max-width: 140px; background: #20242c; border-radius: 3px; overflow: hidden; }
  .ometer > i { display: block; height: 100%; background: var(--calm); border-radius: 3px; }
  .ometer.is-warn > i { background: var(--warn); } .ometer.is-alarm > i { background: var(--alarm); }
  .overage .none { font-family: var(--mono); font-size: 11.5px; color: var(--ink-4); letter-spacing: 0.02em; }
  .overage .banked { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.02em; white-space: nowrap; cursor: help; }
  .overage .banked b { color: var(--ok); font-weight: 600; }

  .actions-cell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .rowbtn { white-space: nowrap; font-family: var(--ui); font-size: 11.5px; cursor: pointer; border-radius: 7px; padding: 5px 9px; border: 1px solid var(--hair); background: transparent; color: var(--ink-3); transition: opacity .12s ease, color .12s, border-color .12s, background .12s; }
  .rowbtn.del { opacity: 0; border-color: transparent; font-size: 13px; padding: 4px 8px; line-height: 1; }
  .row:hover .rowbtn.del { opacity: 1; }
  .rowbtn.del:hover { color: var(--alarm); border-color: var(--alarm-edge); background: var(--alarm-bg); }
  .rowbtn.relogin { color: var(--alarm); border-color: var(--alarm-edge); background: var(--alarm-bg); font-weight: 500; }
  .rowbtn.relogin:hover { background: rgba(229,72,77,0.18); }
  .rowbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* entrance */
  .row, .summary { animation: rise .3s cubic-bezier(.2,.7,.3,1) both; }
  .row:nth-child(2){animation-delay:30ms}.row:nth-child(3){animation-delay:60ms}.row:nth-child(4){animation-delay:90ms}.row:nth-child(5){animation-delay:120ms}.row:nth-child(6){animation-delay:150ms}
  @keyframes rise { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce) { .row, .summary { animation: none; } .meter > i { transition: none; } }

  .foot { margin-top: 15px; font-family: var(--mono); font-size: 11px; color: var(--ink-4); letter-spacing: 0.02em; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .foot .key { display: inline-flex; align-items: center; gap: 6px; }
  .foot .swatch { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .empty { text-align: center; color: var(--ink-3); padding: 64px 20px; font-size: 14px; line-height: 1.6; }
  .empty b { color: var(--ink); }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(6,8,11,.66); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal { background: var(--panel); border: 1px solid var(--hair); border-radius: 14px; padding: 20px 22px; max-width: 540px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .modal-head { display: flex; align-items: center; margin-bottom: 14px; font-weight: 600; font-size: 15px; }
  .modal-head .x { margin-left: auto; background: none; border: none; color: var(--ink-3); font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .modal-head .x:hover { color: var(--ink); background: var(--row-hover); }
  .modal label { display: block; font-size: 12px; color: var(--ink-3); margin: 13px 0 5px; font-family: var(--mono); letter-spacing: 0.02em; text-transform: uppercase; }
  .modal input, .modal textarea { width: 100%; background: var(--bg); border: 1px solid var(--hair); border-radius: 8px; color: var(--ink); padding: 9px 11px; font: 13px var(--mono); }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
  .modal textarea { min-height: 64px; resize: vertical; }
  .modal p { color: var(--ink-2); font-size: 13px; margin: 6px 0; line-height: 1.5; }
  .modal p b { color: var(--ink); }
  .modal .actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .modal .step { display: none; }
  .modal .msg { font-size: 12.5px; margin-top: 11px; min-height: 1em; font-family: var(--mono); }

  @media (min-width: 761px) {

  /* Responsive: below 760px, reflow the table into stacked per-account cards */

<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">

          <div><button class="sort" type="button" data-sort="account" title="Sort by account name">Account<span class="arr" aria-hidden="true"></span></button></div>
          <div><button class="sort" type="button" data-sort="plan" title="Sort by plan (weekly capacity)">Plan<span class="arr" aria-hidden="true"></span></button></div>
          <div><button class="sort" type="button" data-sort="session" title="Sort by session usage">Session&nbsp;&middot;&nbsp;5h<span class="arr" aria-hidden="true"></span></button></div>
          <div class="head-pair"><button class="sort" type="button" data-sort="weekly" title="Sort by weekly usage">Weekly<span class="arr" aria-hidden="true"></span></button><button class="sort" type="button" data-sort="reset" title="Sort by weekly reset (soonest first)">Resets<span class="arr" aria-hidden="true"></span></button></div>
          <div><button class="sort" type="button" data-sort="model" title="Sort by per-model weekly usage">Model&nbsp;wk<span class="arr" aria-hidden="true"></span></button></div>
          <div><button class="sort" type="button" data-sort="overage" title="Sort by overage spent">Overage<span class="arr" aria-hidden="true"></span></button></div>

      No accounts yet. Click <b>+ Add account</b> and sign into each Claude account once &mdash;<br>they stay logged in after that.

<script type="module">
import { computeFleet, tierWeight } from '/fleet.mjs';
import { sortAccounts, nextSort, parseSort, SORT_COLUMNS, DEFAULT_SORT, reloginOffered } from '/board.mjs';
import { RANGES, parseRange, historyQuery, seriesFor, segments, nearest, timeTicks, fleetQuery, fleetGapMs } from '/usage-chart.mjs';
const $ = (s) => document.querySelector(s);
let latest = null;
let lastError = null;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtUsd = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtUsd0 = (n) => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });

function msLeft(iso){ if(!iso) return null; const ms = new Date(iso).getTime() - Date.now(); return isNaN(ms) ? null : ms; }
function shortDur(iso){
  const ms = msLeft(iso); if(ms == null) return '';
  if(ms <= 0) return 'now';
  const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  return d>0 ? `${d}d ${h}h` : h>0 ? `${h}h ${m}m` : `${m}m`;
}
function resetText(iso){ const t = shortDur(iso); return t==='now' ? 'resetting…' : t ? `resets in ${t}` : ''; }

// severity buckets — color is a signal only
function sevOf(pct){ if(pct == null) return 'idle'; if(pct >= 90) return 'alarm'; if(pct >= 70) return 'warn'; if(pct <= 0) return 'idle'; return 'normal'; }
const sevCls = (sev) => sev==='alarm' ? 'is-alarm' : sev==='warn' ? 'is-warn' : sev==='idle' ? 'is-idle' : '';

// ---- board order: headroom by default (most available on top), or a column ----
// Clicking a header sorts by it (usage columns lowest first, plan and overage
// largest first), clicking again reverses, a third click returns to headroom.
// The choice is kept in localStorage. Logic lives in src/board.mjs.
const SORT_KEY = 'ccc.sort';
let sort = DEFAULT_SORT;
try { sort = parseSort(localStorage.getItem(SORT_KEY)); } catch {}
function setSort(next){
  sort = next;
  try { localStorage.setItem(SORT_KEY, `${sort.key}:${sort.dir}`); } catch {}
  render();
}
function renderSortUi(){
  document.querySelectorAll('.head .sort').forEach(b => {
    const on = b.dataset.sort === sort.key;
    b.classList.toggle('on', on);
    b.querySelector('.arr').textContent = on ? (sort.dir === 'asc' ? '\u25B2' : '\u25BC') : '\u25B2';
    b.setAttribute('aria-label', `${b.title}${on ? `, sorted ${sort.dir === 'asc' ? 'ascending' : 'descending'}` : ''}`);
  });
  const note = $('#sortnote');
  if(sort.key === 'headroom'){ note.innerHTML = 'sorted by headroom &middot; most available on top'; return; }
  const col = SORT_COLUMNS[sort.key];
  const text = sort.key === 'account' ? (sort.dir === 'asc' ? 'A&ndash;Z' : 'Z&ndash;A')
    : sort.key === 'reset' ? (sort.dir === 'asc' ? 'soonest first' : 'latest first')
    : (sort.dir === 'asc' ? 'lowest first' : 'highest first');
  note.innerHTML = `sorted by ${esc(col.label)} &middot; ${text} &middot; <button type="button" id="sort-reset">sort by headroom</button>`;
  $('#sort-reset').onclick = () => setSort(DEFAULT_SORT);
}
document.querySelectorAll('.head .sort').forEach(b => b.onclick = () => setSort(nextSort(sort, b.dataset.sort)));

function metricCell(w, kind){
  const lbl = `<span class="clabel">${kind === 'session' ? 'Session &middot; 5h' : 'Weekly'}</span>`;
  if(!w || w.pct == null){
    const label = kind === 'session' ? 'no active session' : 'no data';
    return `<div class="metric">${lbl}<div class="pct is-idle">&mdash;</div><div class="meter is-idle"><i style="width:2%"></i></div><span class="reset muted">${label}</span></div>`;
  }
  const sev = sevOf(w.pct), cls = sevCls(sev);
  const width = Math.max(2, Math.min(100, w.pct));
  const live = w.pct > 0;
  // An unused week still has a fixed reset date upstream; show it. An unused
  // session has none (its 5h window starts at first use).
  const restDate = !live && kind !== 'session' && w.resetsAt && !Number.isNaN(Date.parse(w.resetsAt)) ? w.resetsAt : null;
  const reset = live ? resetText(w.resetsAt) : restDate ? `resets ${fmtDay(restDate)}` : (kind === 'session' ? 'idle' : 'at rest');
  const title = restDate ? ` title="Resets ${esc(fmtDay(restDate))} ${esc(fmtClock(restDate))}"` : '';
  return `<div class="metric">${lbl}
    <div class="pct ${cls}">${w.pct}<span class="sym">%</span></div>
    <div class="meter ${cls}"><i style="width:${width}%"></i></div>
    <span class="reset ${sev==='alarm'?'is-alarm':''} ${live?'':'muted'}"${title} ${live?`data-reset="${esc(w.resetsAt||'')}"`:''}>${esc(reset)}</span>
  </div>`;
}

function modelCell(u){
  const lbl = `<span class="clabel">Model &middot; wk</span>`;
  if(!u) return `<div class="models">${lbl}<span class="none">&mdash;</span></div>`;
  const parts = [];
  const models = u.weeklyModels || [];
  for(const m of models){
    if(m && m.pct != null) parts.push(`<div class="mrow"><span class="ml">${esc(m.name)}</span><span class="mv ${sevCls(sevOf(m.pct))}">${m.pct}%</span></div>`);
  }
  return `<div class="models">${lbl}${parts.length ? parts.join('') : '<span class="none">&mdash;</span>'}</div>`;
}

function overageCell(u){
  const lbl = `<span class="clabel">Overage</span>`;
  const o = u && u.overage;
  const banked = resetsLine(u);
  if(o && o.enabled){
    const width = Math.max(2, Math.min(100, o.pct ?? 0));
    return `<div class="overage">${lbl}
      <span class="amt"><b>${fmtUsd(o.usedUsd)}</b> <span class="of">of ${fmtUsd0(o.limitUsd)}</span></span>
      <div class="ometer ${sevCls(sevOf(o.pct))}"><i style="width:${width}%"></i></div>${banked}
    </div>`;
  }
  return `<div class="overage">${lbl}<span class="none">no overage</span>${banked}</div>`;
}

// Banked limit resets: a line in the overage column, details in its tooltip.
function grantLine(g){
  const by = g.endsAt ? `, use by ${fmtDay(g.endsAt)}` : '';
  const when = g.paused ? 'paused' : g.usableNow ? 'usable now' : g.useRequiresLimit ? 'usable at a limit' : 'not usable yet';
  return `${g.label || 'Reset'}: ${g.left} of ${g.total} left${by} (${when})`;
}
function resetsLine(u){
  const r = u && u.bankedResets;
  if(!r || !(r.left > 0)) return '';
  const lines = (r.grants || []).filter(g => g.left > 0).map(grantLine);
  if(!lines.length && r.nextExpiresAt) lines.push(`use by ${fmtDay(r.nextExpiresAt)}`);
  lines.push('Refills your limits when used from Claude Code.');
  const by = r.nextExpiresAt ? ` &middot; by ${esc(new Date(r.nextExpiresAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }))}` : '';
  // Compact rows share the line with the overage figure, so CSS hides all but the count.
  return `<span class="banked" title="${esc(lines.join('\n'))}"><b>&#x21BA; ${r.left}<span class="long"> reset${r.left === 1 ? '' : 's'}</span></b><span class="long">${by}</span></span>`;
}

function rowFor(a){
  const isRelogin = a.error === 'needs_relogin';
  const isErrored = a.error && !isRelogin;
  const u = a.usage;
  const worst = u ? Math.max(u.session?.pct ?? 0, u.weekly?.pct ?? 0) : 0;
  let cls = '';
  if(isRelogin) cls = 'relogin';
  else if(isErrored && !u) cls = 'errored';
  else if(worst >= 90) cls = 'alarm';
  else if(worst >= 70) cls = 'warn';
  else if(worst <= 0) cls = 'idle';

  const tags = [];
  if(isRelogin) tags.push(`<span class="tag relogin">needs re-login</span>`);
  else if(a.stale) tags.push(`<span class="tag cached" title="${esc(a.message||'showing last-known data')}">cached</span>`);
  else if(isErrored) tags.push(`<span class="tag" title="${esc(a.message||a.error)}">unavailable</span>`);

  const session = isErrored && !u ? null : (u && u.session);
  const weekly  = isErrored && !u ? null : (u && u.weekly);

  let actions = `<button class="rowbtn del" title="Remove from dashboard" data-del="${esc(a.id)}" data-label="${esc(a.label||a.id)}" aria-label="Remove">&#x2715;</button>`;
  const offer = reloginOffered(a);
  if(offer){
    const due = offer === 'due' ? new Date(a.login.reloginDueAt).toISOString().slice(5, 10) : '';
    actions = `<button class="rowbtn relogin" data-relogin="${esc(a.id)}" data-label="${esc(a.label||a.id)}" title="${offer === 'due' ? 'Login due ' + esc(due) + ': sign in again now so it never lapses' : 'Login expired: sign in again'}">${offer === 'due' ? 'Re-login (due ' + esc(due) + ')' : 'Re-login'}</button>` + actions;
  }

  return `<div class="grid row ${cls}" data-id="${esc(a.id)}">
    <div class="tick"><span></span></div>
    <div class="acct">
      <button type="button" class="email" data-hist title="${esc(a.label||a.id)}: show usage over time">${esc(a.label||a.id)}</button>
      ${tags.length ? `<span class="tags">${tags.join('')}</span>` : ''}
    </div>
    <div class="plan">${a.tier ? `<span class="pill">${esc(a.tier)}</span>` : '<span class="pill" style="color:var(--ink-4)">—</span>'}</div>
    <div>${metricCell(session, 'session')}</div>
    <div>${metricCell(weekly, 'weekly')}</div>
    <div>${modelCell(u)}</div>
    <div>${overageCell(u)}</div>
    <div class="actions-cell">${actions}</div>
  </div>`;
}

// ---- fleet bar: every account folded into one capacity-weighted picture ----
// Computed client-side (same module the server uses for /api/usage.fleet) so
// demo mode works and countdowns can tick without re-fetching.
const fmtDay = (iso) => new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const fmtClock = (iso) => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
function inText(iso){ const t = shortDur(iso); return t === 'now' ? 'now' : t ? `in ${t}` : ''; }
// The fleet counts Claude accounts and Codex (served apart as latest.codex),
// with the engine's weights so a Codex week weighs what the engine says.
const codexEntries = () => latest?.codex || [];
function fleetFor(accounts){
  return computeFleet([...accounts, ...codexEntries()], { warnPct: latest?.thresholds?.warnPct ?? 70, critPct: latest?.thresholds?.critPct ?? 90, ...(latest?.weights ? { weights: latest.weights } : {}) });
}

// Codex panel: its own bar per rate-limit window, credits, click for history.
function renderCodex(){
  const el = $('#codex'), list = codexEntries();
  if (!list.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = list.map((c) => {
    const u = c.usage || {};
    const wins = [['Weekly', u.weekly], ['5h', u.session]].filter(([, w]) => w && w.pct != null);
    const credits = u.credits && u.credits.balance != null ? `<span class="cx-credits"><b>${Math.round(u.credits.balance).toLocaleString('en-US')}</b> credits</span>` : '';
    const rows = wins.map(([k, w]) => {
      const cls = w.pct >= 90 ? 'alarm' : w.pct >= 70 ? 'warn' : '';
      const when = w.pct > 0 && w.resetsAt ? `<span data-reset="${esc(w.resetsAt)}">${esc(resetText(w.resetsAt))}</span>` : (w.resetsAt ? `resets ${esc(fmtDay(w.resetsAt))}` : '');
      return `<div class="cx-win"><span class="k">${k}</span><div class="cx-bar ${cls}"><i style="width:${Math.max(1, Math.min(100, w.pct))}%"></i></div><span class="v"><b>${Math.round(w.pct)}%</b> used${when ? ' &middot; ' + when : ''}</span></div>`;
    }).join('');
    const note = c.stale ? `<div class="cx-note">${esc(c.message || 'cached')}</div>` : (u.limitReached ? `<div class="cx-note">limit reached (${esc(u.limitReached)})</div>` : '');
    return `<div data-codex="${esc(c.id)}" title="Click for Codex usage over time. Counts in the fleet bar.">
      <div class="fleet-head"><span class="fleet-title">Codex</span><span class="cx-who">${esc(c.email || c.label)}</span><span class="cx-plan">${esc(c.tier || '')}</span><span class="spacer"></span>${credits}</div>
      ${rows || '<div class="cx-note">no rate-limit windows reported</div>'}${note}
    </div>`;
  }).join('');
  el.className = `fleet codex ${tone(list)}`;
  function tone(l){ const w = Math.max(0, ...l.flatMap((c) => [c.usage?.weekly?.pct ?? 0, c.usage?.session?.pct ?? 0])); return w >= 90 ? 'alarm' : w >= 70 ? 'warn' : ''; }
}
$('#codex').addEventListener('click', (e) => { const d = e.target.closest('[data-codex]'); if (d) openHistory(d.dataset.codex); });
function renderFleet(accounts){
  const el = $('#fleet');
  const f = fleetFor(accounts);
  if(f.usedPct == null){ el.style.display = 'none'; return; }
  const tone = f.severity === 'critical' ? 'alarm' : f.severity === 'warning' ? 'warn' : 'clear';
  const soonH = Math.round(f.soonMs / 3600000);
  const perTitle = f.perAccount.map(p => `${p.label}: ${p.effectivePct}% used (${p.tier || 'unknown plan'}, ${p.sharePct}% of fleet)`).join('\n');

  const legend = [
    `<span class="k"><span class="sw"></span><b>${f.lockedPct}%</b> locked until weekly resets</span>`,
    `<span class="k"><span class="sw soon"></span><b>${f.backSoonPct}%</b> back within ${soonH}h</span>`,
    `<span class="k"><span class="sw free"></span><b>${f.freePct}%</b> free now</span>`,
  ];
  if(f.pace.ratio != null) legend.push(`<span class="k"><span class="sw mark"></span>sustainable pace</span>`);
  if(f.accounts.blocked) legend.push(`<span class="k blocked"><b>${f.accounts.blocked}</b> of ${f.accounts.counted} blocked</span>`);
  if(f.bankedResets && f.bankedResets.left){
    const n = f.bankedResets.left, m = f.bankedResets.accounts.length;
    const t = f.bankedResets.accounts.map(b => `${b.account}: ${b.left}${b.nextExpiresAt ? `, use by ${fmtDay(b.nextExpiresAt)}` : ''}`).join('\n');
    legend.push(`<span class="k banked" title="${esc(t)}">&#x21BA; <b>${n}</b> banked reset${n===1?'':'s'} on ${m} account${m===1?'':'s'}</span>`);
  }
  if(f.accounts.unknown) legend.push(`<span class="k">${f.accounts.unknown} not counted (no data)</span>`);
  if(f.accounts.weightsAssumed) legend.push(`<span class="k">${f.accounts.weightsAssumed} plan${f.accounts.weightsAssumed===1?'':'s'} unknown, weighted as the 5x class</span>`);
  legend.push(`<span class="k" title="The bar is denominated in weekly capacity: Max 20x = 2x the 5x class (Max 5x and Team 5x seats), 5x = 3.5x Pro. Session limits act as throttles, not share. Each account counts its session and all-models weekly limit; per-model weekly limits (Fable) cap only that model, so they count only for Opus, the model the fleet runs on.">weighted by weekly capacity</span>`);

  // Pace: weighted weekly usage vs the elapsed share of each window. The tick
  // on the bar is where usage would sit if the fleet were exactly on pace.
  let pace = '', paceMark = '';
  if(f.pace.ratio != null){
    const hot = f.pace.ratio >= 1.15;
    const dry = f.pace.exhausting.length;
    pace = `<span class="fleet-pace ${hot?'hot':''}" title="Weekly usage divided by the fraction of each weekly window already elapsed, weighted by plan">weekly burn <b>${f.pace.ratio.toFixed(1)}&times;</b> pace${dry ? ` &middot; <b>${dry}</b> of ${f.pace.accounts} run dry before reset` : ''}</span>`;
    const onPace = Math.max(0, Math.min(100, f.usedPct / f.pace.ratio));
    paceMark = `<span class="pace-mark" style="left:${onPace}%" title="on-pace usage: ${Math.round(onPace)}%"></span>`;
  }

  const evs = f.events.slice(0, 4).map(e => `<span class="ev"><span class="who">${esc(e.account)}</span> ${esc(e.kind)} <span class="in" data-in="${esc(e.at)}">${esc(inText(e.at))}</span> <span class="gain">+${e.restoresPct}%</span></span>`);
  const relief = f.events.length
    ? `<div class="fleet-relief"><span class="rl">Next</span>${evs.join('')}${f.freshBy ? `<span class="fresh">all weekly windows fresh by <b>${esc(fmtDay(f.freshBy))} ${esc(fmtClock(f.freshBy))}</b></span>` : ''}</div>`
    : '';

  el.className = `fleet ${tone}`;
  el.style.display = 'block';
  el.innerHTML = `
    <div class="fleet-head">
      <span class="fleet-title">Fleet capacity</span>
      <span class="fleet-num">${f.usedPct}<span class="sym">%</span><span class="lbl">used</span></span>
      <span class="fleet-free"><b>${f.freePct}%</b> free now</span>
      <span class="spacer"></span>
      ${pace}
      <button type="button" class="fleet-hist" data-fleet-hist title="Fleet capacity and usage over time">Over time &rsaquo;</button>
    </div>
    <div class="fleet-bar" role="img" aria-label="Fleet ${f.usedPct}% used, ${f.freePct}% free" title="${esc(perTitle)}">
      <i class="locked" style="width:${f.lockedPct}%"></i><i class="soon" style="width:${f.backSoonPct}%"></i>${paceMark}
    </div>
    <div class="fleet-legend">${legend.join('')}</div>
    ${relief}`;
}

function buildSummary(accounts){
  const el = $('#summary');
  const live = accounts.filter(a => a.usage);
  const relogin = accounts.filter(a => a.error === 'needs_relogin');
  let worst = null;
  for(const a of live){
    for(const k of ['session','weekly']){
      const w = a.usage[k];
      if(w && w.pct != null && (worst == null || w.pct > worst.pct))
        worst = { pct: w.pct, label: a.label, kind: k, resetsAt: w.resetsAt };
    }
  }
  const attn = live.filter(a => Math.max(a.usage.session?.pct ?? 0, a.usage.weekly?.pct ?? 0) >= 90).length + relogin.length;

  let tone = 'clear', sig = 'All clear', line = '';
  if(worst && worst.pct >= 90){
    tone = 'alarm'; sig = 'At limit';
    line = `<b>${esc(worst.label)}</b> is at <span class="mono">${worst.pct}%</span> (${worst.kind}) &mdash; <span class="when" data-reset="${esc(worst.resetsAt||'')}">${esc(resetText(worst.resetsAt))}</span>`;
  } else if(relogin.length){
    tone = 'alarm'; sig = 'Re-login';
    line = relogin.length === 1
      ? `<b>${esc(relogin[0].label)}</b> needs you to sign in again to resume tracking`
      : `<b>${relogin.length} accounts</b> need you to sign in again to resume tracking`;
  } else if(worst && worst.pct >= 70){
    tone = 'warn'; sig = 'Warning';
    line = `<b>${esc(worst.label)}</b> is at <span class="mono">${worst.pct}%</span> (${worst.kind}) &mdash; <span class="when" data-reset="${esc(worst.resetsAt||'')}">${esc(resetText(worst.resetsAt))}</span>`;
  } else if(worst){
    tone = 'clear'; sig = 'All clear';
    line = `Most used: <b>${esc(worst.label)}</b> at <span class="mono">${worst.pct}%</span> &mdash; plenty of headroom`;
  } else {
    tone = 'clear'; sig = 'All clear'; line = `No usage across your accounts right now`;
  }

  el.className = `summary ${tone}`;
  el.style.display = 'flex';
  el.innerHTML = `
    <span class="sig">${sig}</span>
    <div class="line">${line}</div>
    <span class="spacer"></span>
    <span class="total">${attn > 0 ? `<b>${attn}</b> of <b>${accounts.length}</b> need attention` : `all <b>${accounts.length}</b> healthy`}</span>`;
}

function render(){
  if(!latest) return;
  const accounts = sortAccounts(latest.accounts || [], sort, latest.thresholds);
  const has = accounts.length > 0;
  $('#board').style.display = has ? 'block' : 'none';
  $('#foot').style.display = has ? 'flex' : 'none';
  $('#empty').style.display = has ? 'none' : 'block';
  $('#acct-count').textContent = has ? `${accounts.length} account${accounts.length===1?'':'s'}` : '';
  $('#density').style.display = has ? '' : 'none';
  if(has){ $('#rows').innerHTML = accounts.map(rowFor).join(''); renderFleet(accounts); renderCodex(); buildSummary(accounts); }
  else { $('#fleet').style.display = 'none'; $('#summary').style.display = 'none'; }
  updateFreshness();
  renderSortUi();
  applyDensity();
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeAccount(b.dataset.del, b.dataset.label));
  document.querySelectorAll('[data-relogin]').forEach(b => b.onclick = () => addAccount(b.dataset.relogin, b.dataset.label));
}

// ---- density: comfortable (stacked cells) vs compact (one line per account) ----
// 'auto' (default) goes compact only when the comfortable board would overflow
// the viewport, so a long account list never forces a scroll. The Compact
// button pins an explicit choice in localStorage.
const DENSITY_KEY = 'ccc.density';
let density = 'auto';
try { density = localStorage.getItem(DENSITY_KEY) || 'auto'; } catch {}
function applyDensity(){
  const btn = $('#density');
  let compact;
  if(window.innerWidth <= 760) compact = false;            // card layout has its own density
  else if(density === 'compact') compact = true;
  else if(density === 'comfortable') compact = false;
  else {
    document.body.classList.remove('compact');
    compact = document.documentElement.scrollHeight > window.innerHeight + 8;
  }
  document.body.classList.toggle('compact', compact);
  btn.classList.toggle('active', compact);
  btn.setAttribute('aria-pressed', String(compact));
  btn.title = compact ? 'Switch to comfortable rows' : 'Switch to compact single-line rows';
}
$('#density').onclick = () => {
  density = document.body.classList.contains('compact') ? 'comfortable' : 'compact';
  try { localStorage.setItem(DENSITY_KEY, density); } catch {}
  applyDensity();
};
window.addEventListener('resize', applyDensity);

// page freshness — a throttled/frozen tab is visible, not hidden
function updateFreshness(){
  const fr = $('#freshness'), el = $('#updated');
  fr.classList.remove('behind', 'off');
  if(lastError){ el.textContent = lastError; fr.classList.add('off'); return; }
  if(!latest){ el.textContent = ''; return; }
  const s = Math.max(0, Math.round((Date.now() - new Date(latest.generatedAt).getTime())/1000));
  el.textContent = s < 2 ? 'updated just now' : `updated ${s<60 ? s+'s' : Math.floor(s/60)+'m '+(s%60)+'s'} ago`;
  if(s > 90) fr.classList.add('behind');
}

function tick(){
  updateFreshness();
  document.querySelectorAll('[data-reset]').forEach(el => {
    const iso = el.getAttribute('data-reset');
    if(iso){ el.textContent = resetText(iso); }
  });
  document.querySelectorAll('[data-in]').forEach(el => { const iso = el.getAttribute('data-in'); if(iso) el.textContent = inText(iso); });
}

$('#modal-x').onclick = closeModal;

      <div class="actions"><button id="m-finish" class="primary">Finish</button><span class="muted">or <a id="m-back" href="#">start over</a></span></div>
      <div class="msg" id="m-msg2"></div>
    </div>
  `);
}

function removeAccount(id, label){
  openModal('Remove account', `
    <p>Remove <b>${esc(label||id)}</b> from the dashboard? This only forgets the token here &mdash; it does not affect the Claude subscription.</p>
    <div class="actions"><button id="m-del" class="primary" data-id="${esc(id)}">Remove</button><button id="m-cancel" class="ghost">Cancel</button></div>
    <div class="msg" id="m-msg3"></div>

modalBody.addEventListener('click', async (ev) => {
  const t = ev.target;
  if(t.id === 'm-getlink'){
    const label = $('#m-label').value || '';
    $('#m-msg1').className = 'msg'; $('#m-msg1').textContent = 'Starting…';
    try {
      const r = await fetch('/api/login/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ label, replaceId: pendingReplaceId }) });
      const s = await r.json();
      pendingLoginId = s.loginId;
      $('#m-linkwrap').innerHTML = `<p class="muted">If no tab opened: <a class="authlink" href="${s.authorizeUrl}" target="_blank" rel="noopener">open the login link</a></p>`;
      window.open(s.authorizeUrl, '_blank', 'noopener');
      modalBody.querySelector('[data-step="1"]').style.display = 'none';
      modalBody.querySelector('[data-step="2"]').style.display = 'block';
    } catch(e){ $('#m-msg1').className = 'msg err'; $('#m-msg1').textContent = 'Could not start: ' + e; }
  } else if(t.id === 'm-back'){
    ev.preventDefault();
    modalBody.querySelector('[data-step="1"]').style.display = 'block';
    modalBody.querySelector('[data-step="2"]').style.display = 'none';
  } else if(t.id === 'm-finish'){
    const code = $('#m-code').value.trim();
    if(!code){ $('#m-msg2').className = 'msg err'; $('#m-msg2').textContent = 'Paste the code first.'; return; }
    $('#m-msg2').className = 'msg'; $('#m-msg2').textContent = 'Exchanging…';
    try {
      const r = await fetch('/api/login/finish', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ loginId: pendingLoginId, pastedCode: code }) });
      const out = await r.json();
      if(out.error){ $('#m-msg2').className = 'msg err'; $('#m-msg2').textContent = 'Failed: ' + (out.message || out.error); return; }
      $('#m-msg2').className = 'msg ok'; $('#m-msg2').textContent = 'Added ' + (out.label || 'account');
      await load(); setTimeout(closeModal, 800);
    } catch(e){ $('#m-msg2').className = 'msg err'; $('#m-msg2').textContent = 'Failed: ' + e; }
  } else if(t.id === 'm-del'){
    try { await fetch('/api/accounts/' + encodeURIComponent(t.dataset.id), { method:'DELETE' }); closeModal(); await load(); }
    catch(e){ $('#m-msg3').className = 'msg err'; $('#m-msg3').textContent = 'Failed: ' + e; }
  } else if(t.id === 'm-cancel'){ closeModal(); }
});
