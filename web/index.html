// ---- account history: click a row (or its name) to see usage over time ----
// Reads GET /api/history (the poller's 5-minute log) and /api/history/summary.
// Chart math lives in src/usage-chart.mjs; this draws it as inline SVG.
const hist = $('#hist'), histChart = $('#hist-chart');
const HIST_KEY = 'ccc.histRange';
const SERIES_COLOR = { weekly: 'var(--s-weekly)', session: 'var(--s-session)', model: 'var(--s-model)' };
const DRAW_ORDER = ['session', 'model', 'weekly'];   // weekly, the one that locks a week, on top
const MINUTE = 60000, HOUR_MS = 60 * MINUTE, DAY_MS = 24 * HOUR_MS;
let histState = null;

$('#rows').addEventListener('click', (e) => {
  if (e.target.closest('button:not([data-hist])')) return;   // Re-login / remove keep their own action
  const row = e.target.closest('.row[data-id]');
  if (row) openHistory(row.dataset.id);
});
$('#fleet').addEventListener('click', (e) => {
  if (e.target.closest('[data-fleet-hist], .fleet-bar')) openFleetHistory();
});
$('#hist-x').onclick = closeHistory;
hist.onclick = (e) => { if (e.target === hist) closeHistory(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && histState) closeHistory(); });
window.addEventListener('resize', () => { if (histState?.records) drawHistChart(); });

function openHistory(id){
  const a = [...(latest?.accounts || []), ...codexEntries()].find((x) => x.id === id);
  if (!a) return;
  let range = parseRange();
  try { range = parseRange(localStorage.getItem(HIST_KEY)); } catch {}
  histState = { kind: 'account', id, label: a.label || a.id, range, records: null, summary: null, intervalMs: 300000, seq: 0, opener: document.activeElement };
  $('#hist-title').textContent = histState.label;
  $('#hist-sub').textContent = a.tier || '';
  histChart.classList.remove('is-fleet');
  hist.style.display = 'flex';
  $('#hist-x').focus();
  loadHistory();
}

// The fleet bar over time: GET /api/history/fleet replays the fleet math at
// every logged poll (src/history.mjs fleetHistory).
function openFleetHistory(){
  let range = parseRange();
  try { range = parseRange(localStorage.getItem(HIST_KEY)); } catch {}
  const n = (latest?.accounts || []).length + codexEntries().length;
  histState = { kind: 'fleet', label: 'Fleet capacity', range, records: null, summary: null, intervalMs: 300000, seq: 0, opener: document.activeElement };
  $('#hist-title').textContent = 'Fleet capacity';
  $('#hist-sub').textContent = n ? `${n} account${n === 1 ? '' : 's'}, plan-weighted` : '';
  histChart.classList.add('is-fleet');
  hist.style.display = 'flex';
  $('#hist-x').focus();
  loadHistory();
}

function closeHistory(){
  const opener = histState?.opener;
  hist.style.display = 'none';
  histState = null;
  histChart.innerHTML = '';
  if (opener && document.contains(opener)) opener.focus();
}

function renderHistRange(){
  const el = $('#hist-range');
  el.innerHTML = Object.entries(RANGES).map(([k, r]) =>
    `<button type="button" data-range="${k}" class="${k === histState.range ? 'on' : ''}" aria-pressed="${k === histState.range}">${esc(r.label)}</button>`).join('');
  el.querySelectorAll('[data-range]').forEach((b) => b.onclick = () => {
    histState.range = parseRange(b.dataset.range);
    try { localStorage.setItem(HIST_KEY, histState.range); } catch {}
    loadHistory();
  });
}

async function loadHistory(){
  const s = histState;
  if (!s) return;
  const seq = ++s.seq;
  renderHistRange();
  if (!s.records) histChart.innerHTML = '<div class="hist-empty">Loading&hellip;</div>';
  if (s.kind === 'fleet') return loadFleet(s, seq);
  const q = historyQuery(s.id, s.range);
  $('#hist-csv').href = `/api/history?${q}&format=csv`;
  $('#hist-csv').style.display = DEMO ? 'none' : '';
  try {
    let records, summary, intervalMs = 300000;
    if (DEMO) ({ records, summary } = demoHistory(s.id, s.range));
    else {
      const [h, sm] = await Promise.all([
        fetch(`/api/history?${q}`, { cache: 'no-store' }).then((r) => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))),
        fetch(`/api/history/summary?account=${encodeURIComponent(s.id)}&since=${s.range}`, { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).catch(() => null),
      ]);
      // `account` also matches label substrings; keep only this account's rows.
      records = (h.records || []).filter((r) => r.account === s.id);
      summary = sm?.accounts?.find((x) => x.account === s.id) || null;
      intervalMs = sm?.intervalMs || intervalMs;
    }
    if (histState !== s || seq !== s.seq) return;
    Object.assign(s, { records, summary, intervalMs });
    renderHistory();
  } catch (e) {
    if (histState === s && seq === s.seq) histChart.innerHTML = `<div class="hist-empty">Could not load history (${esc(e.message)}). Is the engine running?</div>`;
  }
}

async function loadFleet(s, seq){
  const q = fleetQuery(s.range);
  $('#hist-csv').href = `/api/history/fleet?${q}`;
  $('#hist-csv').textContent = 'open as JSON';
  $('#hist-csv').style.display = DEMO ? 'none' : '';
  try {
    const d = DEMO ? demoFleetHistory(s.range)
      : await fetch(`/api/history/fleet?${q}`, { cache: 'no-store' }).then((r) => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)));
    if (histState !== s || seq !== s.seq) return;
    Object.assign(s, { records: d.points || [], summary: d.summary || null, resets: d.resets || [], intervalMs: d.intervalMs || 300000 });
    renderFleetHistory();
  } catch (e) {
    if (histState === s && seq === s.seq) histChart.innerHTML = `<div class="hist-empty">Could not load fleet history (${esc(e.message)}). Is the engine running?</div>`;
  }
}

function lineSwatch(key, dashed){
  return `<svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="${SERIES_COLOR[key]}" stroke-width="2" stroke-linecap="round"${dashed ? ' stroke-dasharray="4 3"' : ''}/></svg>`;
}

function durText(ms){
  const m = Math.round(ms / MINUTE);
  if (m < 60) return `${m}<small>m</small>`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}<small>h</small> ${m % 60}<small>m</small>`;
  return `${Math.floor(h / 24)}<small>d</small> ${h % 24}<small>h</small>`;
}

function renderHistory(){
  const s = histState;
  $('#hist-csv').textContent = 'open as CSV';
  $('#hist-extra').innerHTML = '';
  const { series, omitted } = seriesFor(s.records);
  $('#hist-legend').innerHTML = series.map((sr) => `<span class="k">${lineSwatch(sr.key, sr.dashed)}${esc(sr.label)}</span>`).join('')
    + (omitted.length ? `<span class="omit">${esc(omitted.join(', '))} not drawn</span>` : '');
  const sm = s.summary;
  const pct = (v) => (v == null ? '&mdash;' : `${Math.round(v)}<small>%</small>`);
  const th = latest?.thresholds || { warnPct: 70, critPct: 90 };
  const tiles = sm ? [
    ['Weekly avg', pct(sm.weekly?.avg), 'Average weekly (all models) usage over the range'],
    ['Weekly peak', pct(sm.weekly?.max), 'Highest weekly usage in the range'],
    ['Session peak', pct(sm.session?.max), 'Highest 5-hour session usage in the range'],
    ['At limit', durText(sm.atLimitSamples * s.intervalMs), `Time with session or weekly at ${th.critPct}% or more (from ${Math.round(s.intervalMs / MINUTE)}-minute samples)`],
    ['Weekly resets', String(sm.resets?.weekly ?? 0), 'How many times the weekly window reset in the range'],
  ] : [];
  if (sm?.overage) tiles.push(['Overage spent', `$${(sm.overage.spentUsd ?? Math.max(0, sm.overage.deltaUsd)).toFixed(2)}`, 'Extra-usage dollars added in the range (billing-cycle resets do not subtract)']);
  $('#hist-stats').innerHTML = tiles.map(([l, v, t]) => `<div class="st" title="${esc(t)}"><div class="sl">${esc(l)}</div><div class="sv">${v}</div></div>`).join('');
  const r = RANGES[s.range];
  const every = r.step ? `one sample per ${r.step.replace('m', ' min').replace('h', ' h')}` : `a sample every ${Math.round(s.intervalMs / MINUTE)} min`;
  const dom = histDomain(s);
  $('#hist-note').textContent = `${every} · gaps = engine off or account unavailable${dom.clipped ? ` · history starts ${fmtDay(new Date(dom.first).toISOString())}` : ''}`;
  drawHistChart();
}

function tickLabel(t, step){
  const d = new Date(t);
  const weekdayDay = () => `${d.toLocaleDateString('en-US', { weekday: 'short' })} ${d.getDate()}`;   // "Mon 19"
  if (step < DAY_MS) return d.getHours() === 0 ? weekdayDay() : d.toLocaleTimeString('en-US', { hour: 'numeric' });
  if (step <= 2 * DAY_MS) return weekdayDay();
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// The chart's time domain: the range, but starting where the log starts when
// the range reaches further back than the history does (a fresh install).
// Only when the log covers a fair part of the range (a quarter or more): a
// brand-new history (minutes old) keeps the full range so the axis reads.
// `late` says the history starts well inside the range either way.
function histDomain(s){
  const r = RANGES[s.range].ms, until = Date.now(), want = until - r;
  const first = s.records?.length ? Date.parse(s.records[0].ts) : want;
  const late = first - want > r * 0.1;
  const from = late && until - first >= r * 0.25 ? first : want;
  return { from, until, clipped: late, first };
}

function drawHistChart(){
  const s = histState;
  if (s.kind === 'fleet') return drawFleetChart();
  const recs = s.records || [];
  if (!recs.length) { histChart.innerHTML = '<div class="hist-empty">No history for this account in this range yet. The engine logs every account every few minutes.</div>'; return; }
  const W = Math.max(280, histChart.clientWidth || 800), H = histChart.clientHeight || 290;
  const m = { l: 40, r: 10, t: 8, b: 24 };
  const range = RANGES[s.range];
  const { from, until } = histDomain(s);
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const x = (t) => m.l + ((t - from) / (until - from)) * pw;
  const y = (v) => m.t + (1 - v / 100) * ph;
  const f = (n) => n.toFixed(1);
  const { series } = seriesFor(recs);
  const th = latest?.thresholds || { warnPct: 70, critPct: 90 };

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.label)}: ${series.map((sr) => sr.label).join(', ')} usage over ${esc(range.label)}">`;
  svg += '<g class="grid">' + [0, 50, 100].map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${f(y(v))}" y2="${f(y(v))}"/>`).join('') + '</g>';
  svg += '<g class="thr">' + [th.warnPct, th.critPct].map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${f(y(v))}" y2="${f(y(v))}"/><text x="${m.l - 8}" y="${f(y(v) + 3.5)}" text-anchor="end">${v}</text>`).join('') + '</g>';
  const { step, ticks } = timeTicks(from, until, W < 560 ? 4 : 7);
  svg += '<g class="axis">' + [0, 50, 100].map((v) => `<text x="${m.l - 8}" y="${f(y(v) + 3.5)}" text-anchor="end">${v}%</text>`).join('')
    + ticks.map((t) => `<text x="${f(x(t))}" y="${H - 6}" text-anchor="middle">${esc(tickLabel(t, step))}</text>`).join('') + '</g>';
  for (const key of DRAW_ORDER) {
    const sr = series.find((z) => z.key === key);
    if (!sr) continue;
    const d = segments(recs, sr.value, range.gapMs).map((run) => run.length === 1
      ? `M${f(x(run[0][0]))},${f(y(run[0][1]))}h0.1`
      : 'M' + run.map(([t, v]) => `${f(x(t))},${f(y(v))}`).join('L')).join('');
    if (d) svg += `<path class="ln" d="${d}" stroke="${SERIES_COLOR[key]}"${sr.dashed ? ' stroke-dasharray="5 4"' : ''}/>`;
  }
  svg += `<g class="hover" style="display:none"><line class="cross" y1="${m.t}" y2="${H - m.b}"/>`
    + series.map((sr) => `<circle class="dot" r="4" data-k="${sr.key}" fill="${SERIES_COLOR[sr.key]}"/>`).join('') + '</g>';
  svg += `<rect x="${m.l}" y="0" width="${pw}" height="${H}" fill="transparent"/></svg><div class="hist-tip" style="display:none"></div>`;
  histChart.innerHTML = svg;

  const svgEl = histChart.querySelector('svg'), hov = svgEl.querySelector('.hover'), tip = histChart.querySelector('.hist-tip');
  const hide = () => { hov.style.display = 'none'; tip.style.display = 'none'; };
  svgEl.addEventListener('pointerleave', hide);
  svgEl.addEventListener('pointermove', (e) => {
    const box = svgEl.getBoundingClientRect();
    const px = (e.clientX - box.left) * (W / box.width);
    const t = from + ((px - m.l) / pw) * (until - from);
    const r = nearest(recs, t);
    const rt = r ? Date.parse(r.ts) : NaN;
    if (!r || Math.abs(rt - t) > range.gapMs) return hide();   // pointer is over a gap
    const cx = x(rt);
    hov.style.display = '';
    const cross = hov.querySelector('.cross');
    cross.setAttribute('x1', f(cx)); cross.setAttribute('x2', f(cx));
    for (const sr of series) {
      const c = hov.querySelector(`[data-k="${sr.key}"]`), v = sr.value(r);
      c.style.display = v == null ? 'none' : '';
      if (v != null) { c.setAttribute('cx', f(cx)); c.setAttribute('cy', f(y(Math.max(0, Math.min(100, v))))); }
    }
    const flags = [r.stale ? 'cached' : '', r.error ? r.error.replace(/_/g, ' ') : ''].filter(Boolean).join(' · ');
    tip.innerHTML = `<div class="tt">${esc(fmtDay(r.ts))} ${esc(fmtClock(r.ts))}${flags ? ` · ${esc(flags)}` : ''}</div>`
      + series.map((sr) => { const v = sr.value(r); return `<div class="tr">${lineSwatch(sr.key, sr.dashed)}<span>${esc(sr.label)}</span><b>${v == null ? '&mdash;' : Math.round(v) + '%'}</b></div>`; }).join('');
    tip.style.display = '';
    const cpx = cx * (box.width / W), tw = tip.offsetWidth;
    tip.style.left = `${cpx + 14 + tw > box.width ? cpx - 14 - tw : cpx + 14}px`;
  });
}


// ---- fleet capacity over time ----
const FLEET_COLOR = { locked: 'var(--s-weekly)', soon: 'var(--s-session)', blocked: 'var(--s-model)', pace: 'var(--ink-2)' };
const areaSwatch = (c, op) => `<svg width="14" height="10" aria-hidden="true"><rect x="0.5" y="0.5" width="13" height="9" rx="2" fill="${c}" fill-opacity="${op}"/></svg>`;
const plainSwatch = (c, dashed) => `<svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="${c}" stroke-width="2" stroke-linecap="round"${dashed ? ' stroke-dasharray="4 3"' : ''}/></svg>`;

function renderFleetHistory(){
  const s = histState, sm = s.summary;
  $('#hist-legend').innerHTML = [
    `<span class="k">${areaSwatch(FLEET_COLOR.locked, 0.85)}Locked until a weekly reset</span>`,
    `<span class="k">${areaSwatch(FLEET_COLOR.soon, 0.6)}Back within 5h</span>`,
    `<span class="k">${plainSwatch(FLEET_COLOR.blocked)}Accounts blocked</span>`,
    `<span class="k">${plainSwatch(FLEET_COLOR.pace)}Weekly burn vs pace</span>`,
    `<span class="k">${hatchSwatch()}Expired unused at a weekly reset</span>`,
  ].join('');
  const pct = (v) => (v == null ? '&mdash;' : `${Math.round(v)}<small>%</small>`);
  const th = latest?.thresholds || { warnPct: 70, critPct: 90 };
  const tiles = sm ? [
    ['Avg used', pct(sm.avgUsedPct), 'Average plan-weighted fleet usage over the range (the fleet bar’s number)'],
    ['Peak used', pct(sm.maxUsedPct), 'Highest fleet usage in the range'],
    ['Lowest free', pct(sm.minFreePct), 'The least free capacity the fleet had at any poll'],
    ['Expired unused', pct(sm.expiredUnusedPct), `Share of the weekly capacity that reset in the range without being used: ${sm.resets ?? 0} resets, about ${((sm.expiredUnusedUnits || 0) / 7).toFixed(1)} Max 20x weeks`],
    ['Any blocked', durText(sm.blockedMs || 0), 'Time with at least one account at 100% (session or weekly)'],
    ['Peak blocked', sm.peakBlocked == null ? '&mdash;' : `${sm.peakBlocked}<small> of ${sm.maxAccounts}</small>`, 'Most accounts blocked at the same time'],
    ['Avg burn', sm.avgPaceRatio == null ? '&mdash;' : `${sm.avgPaceRatio.toFixed(1)}<small>&times;</small>`, 'Weekly usage vs the share of each weekly window elapsed, plan-weighted; 1× is sustainable'],
  ] : [];
  if (sm?.atLimitMs) tiles.splice(3, 0, ['Fleet at ' + th.critPct + '%+', durText(sm.atLimitMs), `Time with the whole fleet at ${th.critPct}% or more used`]);
  $('#hist-stats').innerHTML = tiles.map(([l, v, t]) => `<div class="st" title="${esc(t)}"><div class="sl">${esc(l)}</div><div class="sv">${v}</div></div>`).join('');
  const step = { '15m': '15 min', '1h': 'hour', '3h': '3 h' }[new URLSearchParams(fleetQuery(s.range)).get('step')];
  const dom = histDomain(s);
  $('#hist-note').textContent = `${step ? `one point per ${step}` : `a point every ${Math.round(s.intervalMs / MINUTE)} min`} · same math as the fleet bar: plan-weighted, an account counts its binding window${dom.clipped ? ` · history starts ${fmtDay(new Date(dom.first).toISOString())}` : ''}`;
  drawFleetChart();
  renderFleetExtra();
}

const hatchSwatch = () => `<svg width="14" height="10" aria-hidden="true"><rect x="0.5" y="0.5" width="13" height="9" rx="2" fill="url(#hx-hatch-sw)" stroke="var(--ink-2)" stroke-width="1"/><defs><pattern id="hx-hatch-sw" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="var(--ink-2)" stroke-width="1.5"/></pattern></defs></svg>`;
const max20x = (units) => { const v = units / 7; return v >= 1 || v === 0 ? v.toFixed(1) : v.toFixed(2); };

// Accounts whose weekly window resets within 48 h with capacity left: what
// will expire unused unless work moves there. From the live board numbers.
function expiringSoon(){
  const now = Date.now(), accts = [...(latest?.accounts || []), ...codexEntries()];
  const W = fleetFor(accts).weightTotal || 0;
  return accts.map((a) => {
    const w = a.usage?.weekly, at = Date.parse(w?.resetsAt || '');
    if (!w || w.pct == null || Number.isNaN(at)) return null;
    const left = Math.max(0, 100 - w.pct), wt = tierWeight(a.tier).weight;
    return { label: a.label || a.id, tier: a.tier, at, left, units: (wt * left) / 100, fleetPct: W ? (wt * left) / W : null };
  }).filter((e) => e && e.left > 0 && e.at > now && e.at - now <= 48 * HOUR_MS).sort((a, b) => a.at - b.at);
}

function renderFleetExtra(){
  const s = histState;
  const soon = expiringSoon();
  const soonPct = soon.reduce((t, e) => t + (e.fleetPct || 0), 0);
  const soonRows = soon.map((e) => `<tr><td>${esc(e.label)}</td><td><span class="pill">${esc(e.tier || '')}</span></td><td class="n"><b>${Math.round(e.left)}%</b> left</td><td class="n">${e.fleetPct == null ? '' : `${e.fleetPct.toFixed(1)}% of fleet`}</td><td>resets <span data-in="${esc(new Date(e.at).toISOString())}">${esc(inText(new Date(e.at).toISOString()))}</span> &middot; ${esc(fmtDay(new Date(e.at).toISOString()))} ${esc(fmtClock(new Date(e.at).toISOString()))}</td></tr>`).join('');
  const byAcct = new Map();
  // Grouped by name: a re-added account gets a new id but is the same seat.
  for (const e of s.resets || []) {
    const key = e.label || e.account;
    const g = byAcct.get(key) || { label: key, tier: e.tier, n: 0, unused: 0, units: 0, approx: 0 };
    g.n++; g.unused += e.unusedPct; g.units += e.units; if (e.approx) g.approx++;
    byAcct.set(key, g);
  }
  const all = [...byAcct.values()].sort((a, b) => b.units - a.units || a.label.localeCompare(b.label));
  const groups = all.filter((g) => g.units > 0);
  const full = all.filter((g) => g.units <= 0).map((g) => g.label);
  const sm = s.summary || {};
  const expRows = groups.map((g) => `<tr><td>${esc(g.label)}${g.approx ? ' <span class="pill" title="The last reading before at least one of these resets was over an hour old (engine off or cached), so its unused share is approximate">~</span>' : ''}</td><td><span class="pill">${esc(g.tier || '')}</span></td><td class="n">${g.n}</td><td class="n"><b>${Math.round(g.unused / g.n)}%</b></td><td class="n">${max20x(g.units)}</td></tr>`).join('');
  $('#hist-extra').innerHTML = `
    <div class="hx-sec">
      <div class="hx-h">Use it or lose it &middot; next 48 h ${soon.length ? `<span><b>${soonPct.toFixed(1)}%</b> of the fleet's weekly capacity resets unused unless work moves to these accounts</span>` : ''}</div>
      ${soon.length ? `<div class="hx-scroll"><table class="hx-t"><tbody>${soonRows}</tbody></table></div>` : '<div class="hx-empty">No account resets in the next 48 hours with capacity left.</div>'}
    </div>
    <div class="hx-sec">
      <div class="hx-h">Expired unused in this range ${sm.resets ? `<span>${sm.resets} weekly resets &middot; <b>${Math.round(sm.expiredUnusedPct ?? 0)}%</b> of the capacity that reset went unused &middot; about <b>${max20x(sm.expiredUnusedUnits || 0)}</b> Max 20x weeks</span>` : ''}</div>
      ${groups.length ? `<div class="hx-scroll"><table class="hx-t"><thead><tr><th>Account</th><th>Plan</th><th class="n">Resets</th><th class="n">Avg unused</th><th class="n">Max 20x weeks</th></tr></thead><tbody>${expRows}</tbody></table></div>` : (all.length ? '<div class="hx-empty">Every account used its whole week at every reset in this range.</div>' : '<div class="hx-empty">No weekly resets in this range yet.</div>')}
      ${groups.length && full.length ? `<div class="hx-empty">Used the whole week at every reset: ${esc(full.join(', '))}</div>` : ''}
    </div>`;
}

function drawFleetChart(){
  const s = histState, pts = s.records || [], sm = s.summary || {};
  if (!pts.some((p) => p.usedPct != null)) { histChart.innerHTML = '<div class="hist-empty">No fleet history in this range yet. The engine logs every account every few minutes.</div>'; return; }
  const W = Math.max(280, histChart.clientWidth || 800), H = histChart.clientHeight || 400;
  const m = { l: 44, r: 10, t: 8, b: 24 }, gapY = 22;
  const avail = H - m.t - m.b - 3 * gapY;
  const A = { top: m.t, h: Math.round(avail * 0.5) };
  const B = { top: A.top + A.h + gapY, h: Math.round(avail * 0.16) };
  const C = { top: B.top + B.h + gapY, h: Math.round(avail * 0.16) };
  const D = { top: C.top + C.h + gapY, h: avail - A.h - B.h - C.h };
  const { from, until } = histDomain(s);
  const pw = W - m.l - m.r;
  const x = (t) => m.l + ((t - from) / (until - from)) * pw;
  const f = (n) => n.toFixed(1);
  const yA = (v) => A.top + (1 - Math.max(0, Math.min(100, v)) / 100) * A.h;
  const maxN = Math.max(1, sm.maxAccounts || Math.max(...pts.map((p) => p.total || 0)));
  const yB = (n) => B.top + (1 - n / maxN) * B.h;
  const paces = pts.map((p) => p.paceRatio).filter((v) => v != null);
  // Right after a weekly reset little of the week has elapsed and the ratio
  // spikes; cap the axis at 4x so the usual 0.5-2x range stays readable.
  const rMax = Math.min(4, Math.max(2, Math.ceil(Math.max(0, ...paces) * 2) / 2));
  const yC = (r) => C.top + (1 - Math.min(r, rMax) / rMax) * C.h;
  const th = latest?.thresholds || { warnPct: 70, critPct: 90 };
  const gap = fleetGapMs(s.range);

  // Runs: break at missing fleet numbers and at gaps between points.
  const runs = [];
  let run = null, lastT = null;
  for (const p of pts) {
    const t = Date.parse(p.ts);
    if (p.usedPct == null) { run = null; lastT = t; continue; }
    if (!run || t - lastT > gap) { run = []; runs.push(run); }
    run.push({ t, p });
    lastT = t;
  }
  const hline = (y) => `<line x1="${m.l}" x2="${W - m.r}" y1="${f(y)}" y2="${f(y)}"/>`;
  const lbl = (y, txt) => `<text x="${m.l - 8}" y="${f(y + 3.5)}" text-anchor="end">${txt}</text>`;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fleet capacity over ${esc(RANGES[s.range].label)}: used share split into locked and back within 5 hours, accounts blocked, and weekly burn versus pace">`;
  // Expired-unused bars: one per reset on short ranges, one per local day on
  // 30 / 90 days. Height = that capacity as a share of the fleet's week.
  const perDay = s.range === '30d' || s.range === '90d';
  const dayStart = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const bars = [];
  for (const e of (s.resets || []).filter((e) => e.units > 0 && e.fleetPct != null)) {
    const t = Date.parse(e.at);
    if (t < from || t > until) continue;
    const key = perDay ? dayStart(t) : t;
    let b = perDay ? bars.find((x) => x.key === key) : null;
    if (!b) { b = { key, t0: perDay ? key : t, t1: perDay ? key + DAY_MS : t, pct: 0, events: [] }; bars.push(b); }
    b.pct += e.fleetPct; b.events.push(e);
  }
  const dMax = [2, 5, 10, 20, 50, 100].find((v) => v >= Math.max(0, ...bars.map((b) => b.pct))) || 100;
  const yD = (v) => D.top + (1 - Math.min(v, dMax) / dMax) * D.h;
  svg += '<g class="grid">' + [yA(0), yA(50), yA(100), yB(0), yB(maxN), yC(0), yD(0), yD(dMax)].map(hline).join('') + '</g>';
  svg += `<defs><pattern id="hx-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--ink-2)" stroke-width="1.6"/></pattern></defs>`;
  for (const b of bars) {
    const w = perDay ? Math.max(2, x(b.t1) - x(b.t0) - 2) : Math.max(3, Math.min(8, pw / 160));
    const bx = perDay ? x(b.t0) + 1 : x(b.t0) - w / 2;
    svg += `<rect x="${f(bx)}" y="${f(yD(b.pct))}" width="${f(w)}" height="${f(Math.max(1, yD(0) - yD(b.pct)))}" fill="url(#hx-hatch)" stroke="var(--ink-2)" stroke-width="1" rx="1"/>`;
  }
  svg += '<g class="thr">' + [th.warnPct, th.critPct].map((v) => hline(yA(v)) + lbl(yA(v), v)).join('') + hline(yC(1)) + '</g>';
  // Capacity panel: stacked areas, locked at the bottom, back-within-5h on top of it.
  for (const r of runs) {
    const top = (q) => q.p.lockedPct + q.p.backSoonPct;
    const fwd = (fn) => r.map((q) => `${f(x(q.t))},${f(fn(q))}`).join('L');
    const back = (fn) => [...r].reverse().map((q) => `${f(x(q.t))},${f(fn(q))}`).join('L');
    const x0 = f(x(r[0].t)), x1 = f(x(r[r.length - 1].t));
    svg += `<path d="M${x0},${f(yA(0))}L${fwd((q) => yA(q.p.lockedPct))}L${x1},${f(yA(0))}Z" fill="${FLEET_COLOR.locked}" fill-opacity="0.85"/>`;
    svg += `<path d="M${fwd((q) => yA(top(q)))}L${back((q) => yA(q.p.lockedPct))}Z" fill="${FLEET_COLOR.soon}" fill-opacity="0.6"/>`;
    svg += `<path class="sep" d="M${fwd((q) => yA(q.p.lockedPct))}"/>`;
    // Blocked: a step line (the count holds until the next poll).
    let d = '';
    r.forEach((q, i) => { d += i ? `H${f(x(q.t))}V${f(yB(q.p.blocked))}` : `M${f(x(q.t))},${f(yB(q.p.blocked))}`; });
    svg += `<path class="ln" d="${d}" stroke="${FLEET_COLOR.blocked}"/>`;
    // Pace: a plain line; skips points where no weekly window had enough elapsed time.
    let dp = '', pen = false;
    for (const q of r) {
      if (q.p.paceRatio == null) { pen = false; continue; }
      dp += `${pen ? 'L' : 'M'}${f(x(q.t))},${f(yC(q.p.paceRatio))}`;
      pen = true;
    }
    if (dp) svg += `<path class="ln" d="${dp}" stroke="${FLEET_COLOR.pace}"/>`;
  }
  const { step, ticks } = timeTicks(from, until, W < 560 ? 4 : 7);
  svg += '<g class="axis">' + lbl(yA(0), '0%') + lbl(yA(50), '50%') + lbl(yA(100), '100%')
    + lbl(yB(0), '0') + lbl(yB(maxN), maxN) + lbl(yC(1), '1&times;') + lbl(yC(rMax), `${rMax}&times;`) + lbl(yD(0), '0%') + lbl(yD(dMax), `${dMax}%`)
    + ticks.map((t) => `<text x="${f(x(t))}" y="${H - 6}" text-anchor="middle">${esc(tickLabel(t, step))}</text>`).join('') + '</g>';
  svg += `<text class="ptitle" x="${m.l}" y="${B.top - 7}">Accounts blocked</text><text class="ptitle" x="${m.l}" y="${C.top - 7}">Weekly burn vs sustainable pace</text><text class="ptitle" x="${m.l}" y="${D.top - 7}">Expired unused at weekly resets (% of fleet week${perDay ? ', per day' : ''})</text>`;
  svg += `<g class="hover" style="display:none"><line class="cross" y1="${m.t}" y2="${H - m.b}"/>`
    + ['used', 'locked', 'blocked', 'pace'].map((k) => `<circle class="dot" r="4" data-k="${k}" fill="${k === 'used' ? FLEET_COLOR.soon : FLEET_COLOR[k]}"/>`).join('') + '</g>';
  svg += `<rect x="${m.l}" y="0" width="${pw}" height="${H}" fill="transparent"/></svg><div class="hist-tip" style="display:none"></div>`;
  histChart.innerHTML = svg;

  const live = pts.filter((p) => p.usedPct != null);
  // Resets near the pointer: the hovered day's bar, or the closest reset bar.
  const near = Math.max(gap, (until - from) / 120);
  const expiredTip = (t) => {
    const b = perDay ? bars.find((x) => t >= x.t0 && t < x.t1) : bars.reduce((best, x) => (Math.abs(x.t0 - t) <= near && (!best || Math.abs(x.t0 - t) < Math.abs(best.t0 - t)) ? x : best), null);
    if (!b) return '';
    const evs = [...b.events].sort((a, c) => c.units - a.units);
    const head = perDay ? `${esc(fmtDay(new Date(b.t0).toISOString()))}: ${b.pct.toFixed(1)}% of fleet week` : `${esc(fmtDay(evs[0].at))} ${esc(fmtClock(evs[0].at))}: ${b.pct.toFixed(1)}% of fleet week`;
    return `<div class="tr" style="margin-top:4px">${hatchSwatch()}<span>Expired unused</span><b>${head}</b></div>`
      + evs.slice(0, 3).map((e) => `<div class="tr"><span style="width:18px"></span><span>${esc(e.label)}</span><b>${Math.round(e.unusedPct)}% unused${e.approx ? ' ~' : ''}</b></div>`).join('')
      + (evs.length > 3 ? `<div class="tr"><span style="width:18px"></span><span>+${evs.length - 3} more</span></div>` : '');
  };
  const svgEl = histChart.querySelector('svg'), hov = svgEl.querySelector('.hover'), tip = histChart.querySelector('.hist-tip');
  const hide = () => { hov.style.display = 'none'; tip.style.display = 'none'; };
  const dot = (k, y) => { const c = hov.querySelector(`[data-k="${k}"]`); c.style.display = y == null ? 'none' : ''; if (y != null) { c.setAttribute('cx', f(cxNow)); c.setAttribute('cy', f(y)); } };
  let cxNow = 0;
  svgEl.addEventListener('pointerleave', hide);
  svgEl.addEventListener('pointermove', (e) => {
    const box = svgEl.getBoundingClientRect();
    const t = from + (((e.clientX - box.left) * (W / box.width) - m.l) / pw) * (until - from);
    const p = nearest(live, t);
    const pt = p ? Date.parse(p.ts) : NaN;
    if (!p || Math.abs(pt - t) > gap) return hide();
    cxNow = x(pt);
    hov.style.display = '';
    const cross = hov.querySelector('.cross');
    cross.setAttribute('x1', f(cxNow)); cross.setAttribute('x2', f(cxNow));
    dot('used', yA(p.lockedPct + p.backSoonPct)); dot('locked', yA(p.lockedPct)); dot('blocked', yB(p.blocked)); dot('pace', p.paceRatio == null ? null : yC(p.paceRatio));
    const row = (sw, label, val) => `<div class="tr">${sw}<span>${label}</span><b>${val}</b></div>`;
    tip.innerHTML = `<div class="tt">${esc(fmtDay(p.ts))} ${esc(fmtClock(p.ts))}${p.stale ? ` · ${p.stale} cached` : ''}</div>`
      + row(areaSwatch('var(--ink-3)', 0.5), 'Used', `${Math.round(p.usedPct)}%`)
      + row(areaSwatch(FLEET_COLOR.locked, 0.85), '&nbsp;&nbsp;locked until weekly', `${Math.round(p.lockedPct)}%`)
      + row(areaSwatch(FLEET_COLOR.soon, 0.6), '&nbsp;&nbsp;back within 5h', `${Math.round(p.backSoonPct)}%`)
      + row(areaSwatch('var(--hair)', 1), 'Free', `${Math.round(p.freePct)}%`)
      + row(plainSwatch(FLEET_COLOR.blocked), 'Blocked', `${p.blocked} of ${p.total}`)
      + row(plainSwatch(FLEET_COLOR.pace), 'Weekly burn', p.paceRatio == null ? '&mdash;' : `${p.paceRatio.toFixed(1)}&times; pace`)
      + expiredTip(t);
    tip.style.display = '';
    const cpx = cxNow * (box.width / W), tw = tip.offsetWidth;
    tip.style.left = `${cpx + 14 + tw > box.width ? cpx - 14 - tw : cpx + 14}px`;
  });
}

// Demo fleet history (?demo): the demo accounts' traces run through the same
// computeFleet the fleet bar uses.
function demoFleetHistory(range){
  const stepMs = { '24h': 5 * MINUTE, '7d': 15 * MINUTE, '30d': HOUR_MS, '90d': 3 * HOUR_MS }[parseRange(range)];
  const accts = demoData().accounts;
  const traces = accts.map((a) => demoHistory(a.id, range, stepMs).records);
  const points = traces[0].map((r0, i) => {
    const now = Date.parse(r0.ts);
    const accounts = accts.map((a, j) => {
      const r = traces[j][i];
      const next = (period) => new Date(Math.ceil(now / period) * period).toISOString();
      return { id: a.id, label: a.label, tier: a.tier, usage: { session: { pct: r.session.pct, resetsAt: next(5 * HOUR_MS) }, weekly: { pct: r.weekly.pct, resetsAt: next(7 * DAY_MS) }, weeklyModels: [] } };
    });
    const fl = computeFleet(accounts, { now });
    return { ts: r0.ts, usedPct: fl.usedPct, freePct: fl.freePct, backSoonPct: fl.backSoonPct, lockedPct: fl.lockedPct, blocked: fl.accounts.blocked, counted: fl.accounts.counted, total: fl.accounts.total, paceRatio: fl.pace.ratio, stale: 0 };
  });
  const used = points.map((p) => p.usedPct);
  const summary = { avgUsedPct: used.reduce((a, b) => a + b, 0) / used.length, maxUsedPct: Math.max(...used), minFreePct: Math.min(...points.map((p) => p.freePct)), blockedMs: points.filter((p) => p.blocked).length * stepMs, peakBlocked: Math.max(...points.map((p) => p.blocked)), maxAccounts: accts.length, avgPaceRatio: 1.2 };
  const resets = [];
  const W = accts.reduce((t, a) => t + tierWeight(a.tier).weight, 0);
  accts.forEach((a, j) => traces[j].forEach((r, i) => {
    const prev = traces[j][i - 1];
    if (prev && r.weekly.pct < prev.weekly.pct - 20) {
      const wt = tierWeight(a.tier).weight, unused = 100 - prev.weekly.pct;
      resets.push({ account: a.id, label: a.label, tier: a.tier, weight: wt, at: r.ts, usedPct: prev.weekly.pct, unusedPct: unused, units: (wt * unused) / 100, approx: false, fleetPct: (100 * wt * unused) / 100 / W });
    }
  }));
  const units = resets.reduce((t, e) => t + e.units, 0);
  Object.assign(summary, { resets: resets.length, expiredUnusedUnits: units, expiredUnusedPct: resets.length ? (100 * units) / resets.reduce((t, e) => t + e.weight, 0) : null });
  return { points, summary, resets, intervalMs: stepMs };
}

// Demo history (?demo): a plausible week-shaped trace per fake account so the
// view can be previewed without an engine. Deterministic per account id.
function demoHistory(id, range, stepOverride){
  const r = RANGES[range];
  const stepMs = stepOverride || (r.step === '30m' ? 30 * MINUTE : r.step === '2h' ? 2 * HOUR_MS : 5 * MINUTE);
  let seed = [...String(id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32;
  const phase = rnd() * 7 * DAY_MS, rate = 0.55 + rnd() * 0.6, burst = 0.5 + rnd() * 0.6;
  const now = Math.floor(Date.now() / stepMs) * stepMs, gapAt = now - 2 * DAY_MS;
  const records = [];
  for (let t = now - r.ms; t <= now; t += stepMs) {
    if (t > gapAt - 3 * HOUR_MS && t < gapAt) continue;   // an engine restart
    const hour = new Date(t).getHours(), busy = hour >= 8 && hour < 21;
    const weekly = Math.min(100, Math.round((((t + phase) % (7 * DAY_MS)) / (7 * DAY_MS)) * 100 * rate * 1.25));
    const session = busy ? Math.min(100, Math.round(((t % (5 * HOUR_MS)) / (5 * HOUR_MS)) * 100 * burst * 1.3)) : 0;
    records.push({ ts: new Date(t).toISOString(), account: id, session: { pct: session }, weekly: { pct: weekly }, models: [{ name: 'Fable', pct: Math.round(weekly * 0.35) }], stale: false, error: null });
  }
  const ws = records.map((x) => x.weekly.pct), ss = records.map((x) => x.session.pct);
  const resets = ws.filter((v, i) => i && v < ws[i - 1] - 20).length;
  const atLimit = records.filter((x) => Math.max(x.session.pct, x.weekly.pct) >= 90).length * (stepMs / 300000);
  const summary = { weekly: { avg: ws.reduce((a, b) => a + b, 0) / ws.length, max: Math.max(...ws) }, session: { max: Math.max(...ss) }, resets: { weekly: resets }, atLimitSamples: atLimit, overage: null };
  return { records, summary };
}

setInterval(load, 30000);
setInterval(tick, 1000);
